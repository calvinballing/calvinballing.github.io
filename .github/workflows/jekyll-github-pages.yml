name: Build and Deploy a Jekyll Site to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 setup
        uses: actions/checkout@v4

        # include the lines below if you are using jekyll-last-modified-at
        # or if you would otherwise need to fetch the full commit history
        # however this may be very slow for large repositories!
        # with:
        # fetch-depth: '0'
      - name: 💎 setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # Install ImageMagick for rmagick gem
      - name: 🖼️ Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagickwand-dev imagemagick

      # Manual bundle install
      - name: 📦 Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      # See https://github.com/bglw/jekyll-postcss-v2 for example GitHub Action
      # Install Node as this is needed for PostCSS
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Install PostCSS plugins (from your package.json)
      - name: npm install
        run: npm install

      - name: 🔨 install dependencies & build site
        uses: limjh16/jekyll-action-ts@v2
        with:
          enable_cache: false

      - name: 🚀 deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          # if the repo you are deploying to is <username>.github.io, uncomment the line below.
          # if you are including the line below, make sure your source files are NOT in the "main" branch:
